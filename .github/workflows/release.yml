name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Reads Conventional Commits since the last release, maintains a release
    # PR with the changelog and version bump; merging that PR tags the release.
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

  android:
    # A release builds the signed Android files and attaches them to it. It runs here, not on the tag: an event made
    # with the workflow's own token starts no other workflow.
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/android.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  ios:
    # The same for iOS: the signed build goes to TestFlight, an unsigned IPA is attached to the release when the secrets are missing
    # (ADR 0041, 0042). Free on a public repository.
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/ios.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # Without this the Apple secrets are empty in the called workflow and the build is unsigned, nothing goes to TestFlight.
    secrets: inherit
