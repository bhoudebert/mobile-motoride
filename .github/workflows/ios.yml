name: iOS build

# Builds the iOS app on a GitHub macOS runner. With the four Apple secrets (docs/SHIPPING.md, section 8) it signs the app
# with the paid account and uploads it to TestFlight; without them it keeps an unsigned IPA, as before (ADR 0042, ADR 0041).
# Run by hand (Actions ▸ iOS build ▸ Run workflow) to try a build, and by the Release workflow with the new tag.
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the signed build to TestFlight (needs the Apple secrets)
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: The release tag to attach the file to
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: The Apple secrets are configured
        id: apple
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple secrets missing: building an unsigned IPA, nothing goes to TestFlight (docs/SHIPPING.md)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Xcode in use
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: npm ci --ignore-scripts
      - name: Generate the iOS project and its pods
        run: npx expo prebuild --platform ios --clean
      - name: Build without signing
        if: steps.apple.outputs.signed != 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MotoRide.xcworkspace \
            -scheme MotoRide \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60
      - name: Archive, then sign on export
        if: steps.apple.outputs.signed == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p "$HOME/.private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcodebuild archive \
            -workspace MotoRide.xcworkspace \
            -scheme MotoRide \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MotoRide.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/MotoRide.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 30
      - name: Collect the signed IPA
        if: steps.apple.outputs.signed == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist-ios
          cp ios/build/export/MotoRide.ipa "dist-ios/motoride-$version-appstore.ipa"
          ls -lh dist-ios
      - name: Upload to TestFlight
        if: steps.apple.outputs.signed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.testflight)
        run: |
          xcrun altool --upload-app --type ios \
            --file dist-ios/*-appstore.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Pack the IPA
        if: steps.apple.outputs.signed != 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist-ios/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/MotoRide.app dist-ios/Payload/
          (cd dist-ios && zip -qry "motoride-$version.ipa" Payload && rm -rf Payload)
          ls -lh dist-ios
      - uses: actions/upload-artifact@v7
        with:
          name: motoride-ios
          path: dist-ios/*
          retention-days: 30
      - name: Attach to the release
        if: inputs.tag != '' && steps.apple.outputs.signed != 'true'
        run: gh release upload "$TAG" dist-ios/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
